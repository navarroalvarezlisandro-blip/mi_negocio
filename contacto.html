<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Mi Negocio</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="informacion.html">Información</a>
      <a href="contacto.html">Contacto</a>
    </nav>
  </header>

  <main>
    <h1>Contacto</h1>

    <section class="contenido">
      <h2>Escríbenos</h2>
      <p>Si tienes dudas, pedidos o sugerencias, déjanos tu mensaje.</p>
      <form>
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" required>

        <label for="correo">Correo</label>
        <input id="correo" type="email" required>

        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" rows="5" required></textarea>

        <button type="submit">Enviar</button>
      </form>
    </section>

    <section class="contenido">
      <h2>Horario</h2>
      <p>Lunes a viernes: 8:00 a 18:00</p>
      <p>Sábado: 9:00 a 15:00</p>
    </section>
  </main>

  <footer>
    <p>Mi Negocio - Cafetería</p>
  </footer>
</body>
</html>
